<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>陳則皞</title>
<meta name="description" content="陳則皞 — 暫時陪伴你走過一段小日子。">
<meta property="og:type" content="website">
<meta property="og:title" content="陳則皞">
<meta property="og:description" content="暫時陪伴你走過一段小日子">
<meta name="theme-color" content="#2a1f12">
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* =========================================================
   陳則皞 · 一頁式
   ── 這是「Portaly 的骨架 + 像素皮膚」,不是模擬一台遊戲機。
      耗耗 2026-08-09 02:47:「我不要真的 8-bit 啦,它就是一頁網頁,
      有點像是皮膚」「不需要有那麼多花裡胡哨的東西」。
      → 沒有開機畫面、沒有假的主機外殼。

   🎨 2026-08-09 02:5x 改配色 —— 耗耗看了深藍那版說「很像我們另外一顆籤詩的設計,
      我沒有那麼喜歡」「我希望它的設計跟官方網站一樣,官方網站的配色跟設計
      是我非常喜歡的」。
      → 色票、字體、按鈕陰影**整套沿用 `mr-alleys-site/css/styles.css`**:
        羊皮紙底 + 黃銅色 + 深墨字 + 硬邊位移陰影(不用 blur)。
      🩸 關鍵是 **Cubic 11 這支中文像素字** —— 官網的「巷弄故事館」之所以是像素字
        就是它。沒有它,中文會變成一般黑體,整個像素感就只剩英文,差很多。
   ── 內容全部來自 content.json,後台改了這裡就會變。
   ========================================================= */
@font-face{
  font-family:"Cubic 11";
  src:url("assets/Cubic_11_1.013_R.ttf") format("truetype");
  font-weight:400;font-style:normal;font-display:swap;
}
/* 🩸 2026-08-09:Cubic 11 沒有「皞」這個字(cmap 實查 U+769E 不存在,PIL 畫出來是豆腐框),
   瀏覽器會自己抓別套字補那一個字 → 名字三個字看起來不同掛,耗耗當場抓到。
   Fusion Pixel 12px 的繁中集就是拿 Cubic 11 縫的,字形幾乎一模一樣但收了 36,518 字,
   所以「換一套有這個字的像素字型」比「名字改成非像素字」好 —— 像素感一點都沒掉。
   這裡只 subset 站上真的會用到的 594 字 = 22 KB(完整版 904 KB,不必扛)。
   ⚠️ 只用在名字(.top__name / .bar__l);其他地方維持 Cubic 11,沒動耗耗看過的版型。 */
@font-face{
  font-family:"Fusion Pixel";
  src:url("assets/fusion-pixel-12px-tc-subset.woff2") format("woff2");
  font-weight:400;font-style:normal;font-display:swap;
}
:root{
  --paper:#f3ead4; --paper-soft:#ede2c4; --paper-edge:#c9b88c;
  --ink:#2a1f12; --ink-soft:#5e4a30; --ink-mute:#8a7556;
  --brass:#b8801f; --brass-light:#d4a13a; --brass-deep:#6e4d10;
  --px:4px;
  --pixel-en:'Press Start 2P','Cubic 11',monospace;
  --pixel-tc:'Cubic 11','Press Start 2P','Noto Sans TC',monospace;
  /* 名字專用(2026-08-09 耗耗:「有點醜…找一個比較清楚的,不一定要像素風」)
     → 改用系統中文字:iPhone/Mac 是 PingFang、Windows 是微軟正黑,零下載、渲染最好看,
       而且「皞」這種罕用字系統字型一定有,不會再缺字。像素感留給其他元素。 */
  --name-face:'PingFang TC','PingFang SC','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif;
  --sans:'Noto Sans TC','PingFang TC',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--sans);line-height:1.8;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  /* 公會布告欄的紙:很淡的點陣格 */
  background-image:radial-gradient(circle,rgba(42,31,18,.08) 1px,transparent 1.5px);
  background-size:16px 16px;background-attachment:fixed;
}
/* 掃描線做很淡,是質感不是特效 */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:1;
  background-image:repeating-linear-gradient(0deg,rgba(42,31,18,.03) 0 1px,transparent 1px 4px);
}
/* 🩸 不要在這裡加 image-rendering:pixelated —— 耗耗 2026-08-09 03:29 明講
   「那四張圖不要像素畫」。他給的是真的專輯封面跟真的照片,
   加了那行瀏覽器縮圖時會把它們弄得很粗糙。像素感靠字體跟邊框做,不靠圖。 */
img{max-width:100%;display:block}

/* ── 跑馬燈(黃銅底,沿用官網)────────────────── */
.marquee{
  position:sticky;top:0;z-index:60;height:30px;line-height:30px;
  background:var(--brass-deep);color:var(--paper);
  font-family:var(--pixel-tc);font-size:12px;letter-spacing:.12em;
  overflow:hidden;white-space:nowrap;
}
.marquee[hidden]{display:none!important}
.marquee__track{
  display:inline-block;padding-left:100%;
  animation:marquee-scroll var(--marquee-speed,26s) linear infinite;will-change:transform;
}
.marquee:hover .marquee__track{animation-play-state:paused}
@keyframes marquee-scroll{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){.marquee__track{animation:none;padding-left:0}}

/* ── 深色狀態列(官網那條)────────────────── */
.bar{
  position:sticky;top:30px;z-index:50;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 18px;background:var(--ink);color:var(--paper);
  font-family:var(--pixel-en);font-size:9px;letter-spacing:.1em;
  border-bottom:var(--px) solid var(--brass);
}
.bar__l{color:var(--brass-light);font-family:var(--name-face);font-size:11px;letter-spacing:.04em}
.bar__r{color:var(--ink-mute)}

.wrap{max-width:560px;margin:0 auto;padding:0 18px 72px;position:relative;z-index:2;
      opacity:1;transition:opacity .2s}
.wrap[data-ready="0"]{opacity:0}

/* ── 頭 ───────────────────────────────────── */
.top{padding:44px 0 8px;text-align:center}
.top__avatar{
  width:104px;height:104px;margin:0 auto 22px;object-fit:cover;background:var(--paper-soft);
  box-shadow:var(--px) var(--px) 0 var(--ink),0 0 0 var(--px) var(--ink);
}
.top__avatar[hidden]{display:none}
.top__name{
  font-family:var(--name-face);font-weight:600;
  font-size:clamp(34px,10vw,48px);line-height:1.25;margin:0 0 12px;letter-spacing:.06em;
  color:var(--ink);
}
.top__tag{margin:0;font-family:var(--pixel-tc);font-size:15px;color:var(--brass-deep);letter-spacing:.06em}

/* ── 社群列 ───────────────────────────────── */
.socials{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:26px 0 0}
.social{
  font-family:var(--pixel-en);font-size:9px;letter-spacing:.1em;text-decoration:none;
  color:var(--ink);background:var(--paper-soft);padding:11px 13px;
  box-shadow:3px 3px 0 var(--ink),0 0 0 2px var(--ink);
  transition:transform .08s steps(1),box-shadow .08s steps(1);
}
.social:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink),0 0 0 2px var(--ink)}
.social:active{transform:translate(3px,3px);box-shadow:0 0 0 2px var(--ink)}

/* ── 主要按鈕 ─────────────────────────────── */
.btn{
  display:block;margin:16px 0 0;text-align:center;text-decoration:none;cursor:pointer;
  font-family:var(--pixel-tc);font-size:17px;letter-spacing:.06em;line-height:1.5;
  color:var(--paper);background:var(--brass);padding:15px 14px;border:0;width:100%;
  box-shadow:var(--px) var(--px) 0 var(--ink),0 0 0 2px var(--ink),
             inset calc(var(--px)*-1) calc(var(--px)*-1) 0 rgba(0,0,0,.18),
             inset var(--px) var(--px) 0 rgba(255,255,255,.22);
  transition:transform .08s steps(1),box-shadow .08s steps(1);
}
.btn small{display:block;font-family:var(--sans);font-size:12px;opacity:.86;margin-top:6px;letter-spacing:0}
.btn:hover{transform:translate(-1px,-1px)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 2px var(--ink)}
.btn[hidden]{display:none}
.btn--alt{background:var(--paper-soft);color:var(--ink)}
.blk{margin-top:34px}

/* ── 段落小標 ─────────────────────────────── */
.label{
  font-family:var(--pixel-tc);font-size:13px;letter-spacing:.16em;color:var(--ink-mute);
  text-align:center;margin:0 0 14px;
}
.label[hidden]{display:none}

/* ── 電子報(內嵌表單,不是跳出去)──────────────── */
.mail{
  margin-top:34px;background:var(--paper-soft);padding:20px 18px;
  box-shadow:var(--px) var(--px) 0 var(--ink),0 0 0 2px var(--ink);
}
.mail[hidden]{display:none}
.mail__t{font-family:var(--pixel-tc);font-size:17px;margin:0 0 6px;letter-spacing:.04em}
.mail__d{margin:0 0 14px;font-size:13px;color:var(--ink-soft)}
.mail__row{display:flex;gap:10px;flex-wrap:wrap}
.mail__row input{
  flex:1 1 190px;min-width:0;font:inherit;font-size:15px;padding:13px 12px;
  background:var(--paper);color:var(--ink);border:0;box-shadow:0 0 0 2px var(--ink);
}
.mail__row input:focus{outline:0;box-shadow:0 0 0 2px var(--brass)}
.mail__row .btn{margin:0;width:auto;flex:0 0 auto;padding:13px 22px;font-size:15px}
.mail__ok{margin:12px 0 0;font-size:13px;color:var(--brass-deep);min-height:19px}

/* ── 嵌入影片 ─────────────────────────────── */
.video{margin-top:34px}
.video[hidden]{display:none}
.video__t{
  font-family:var(--pixel-tc);font-size:13px;letter-spacing:.16em;color:var(--ink-mute);
  text-align:center;margin:0 0 14px;
}
/* 16:9 用 aspect-ratio,不要用 padding-top hack —— 現在瀏覽器都吃 */
.video__frame{
  aspect-ratio:16/9;background:var(--ink);
  box-shadow:var(--px) var(--px) 0 var(--ink),0 0 0 2px var(--ink);
}
.video__frame iframe{width:100%;height:100%;display:block;border:0}

/* ── 吊飾卡 ───────────────────────────────── */
.items{display:grid;gap:12px}
.item{
  display:flex;gap:14px;align-items:center;text-decoration:none;color:var(--ink);
  background:var(--paper-soft);padding:12px;
  box-shadow:3px 3px 0 var(--ink),0 0 0 2px var(--ink);
  transition:transform .08s steps(1),box-shadow .08s steps(1);
}
.item:hover{transform:translate(-1px,-1px);box-shadow:var(--px) var(--px) 0 var(--ink),0 0 0 2px var(--ink)}
.item:active{transform:translate(3px,3px);box-shadow:0 0 0 2px var(--ink)}
.item__cover{
  width:56px;height:56px;flex:0 0 56px;background:var(--paper);
  box-shadow:0 0 0 2px var(--ink);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--pixel-en);font-size:7px;color:var(--ink-mute);
}
.item__cover img{width:100%;height:100%;object-fit:cover}
.item__t{display:block;font-family:var(--pixel-tc);font-size:16px;line-height:1.5}
.item__s{display:block;font-size:12px;color:var(--ink-mute);margin-top:4px}

/* ── 日記 ─────────────────────────────────── */
.about{
  background:var(--paper-soft);padding:22px 20px;
  box-shadow:var(--px) var(--px) 0 var(--ink),0 0 0 2px var(--ink);
}
.about[hidden]{display:none}
.about h2{font-family:var(--pixel-tc);margin:0 0 14px;font-size:19px;font-weight:400;letter-spacing:.05em}
.about p{margin:0 0 18px;font-size:14.5px;line-height:2.1;color:var(--ink-soft)}
.about p:last-of-type{margin-bottom:0}
.about__sig{margin-top:20px;text-align:right;color:var(--ink-mute);font-size:12px}

.foot{
  margin-top:48px;text-align:center;
  font-family:var(--pixel-en);font-size:8px;color:var(--ink-mute);letter-spacing:.16em;
}
/* 後台入口 —— 跟官網一樣做成頁尾一行很淡的字(耗耗叫它「浮水印按鈕」)。
   平常幾乎看不見,滑過去才變深。不放在導覽列,不加 icon。 */
.foot__admin{
  display:inline-block;margin-top:8px;
  font-family:var(--pixel-en);font-size:9px;letter-spacing:.2em;
  color:var(--paper-edge);text-decoration:none;transition:color .4s ease;
}
.foot__admin:hover{color:var(--ink-mute)}
</style>
</head>
<body>

<div class="marquee" id="marquee" hidden><div class="marquee__track" id="marqueeTrack"></div></div>
<div class="bar"><span class="bar__l" id="barL">陳則皞</span><span class="bar__r" id="barR">HAOHAO.UNZIP</span></div>

<div class="wrap" id="wrap" data-ready="0">

  <header class="top">
    <img class="top__avatar" id="avatar" alt="" hidden>
    <h1 class="top__name" id="name">陳則皞</h1>
    <p class="top__tag" id="tagline"></p>
    <nav class="socials" id="socials" aria-label="社群連結"></nav>
  </header>

  <a class="btn blk" id="podcastBtn" href="#" target="_blank" rel="noopener" hidden></a>

  <!-- 電子報:有 formAction 就內嵌表單,只有 url 就當一般按鈕 -->
  <section class="mail" id="mail" hidden>
    <h2 class="mail__t" id="mailTitle"></h2>
    <p class="mail__d" id="mailDesc"></p>
    <form class="mail__row" id="mailForm" target="mailSink" method="POST">
      <input type="email" id="mailInput" name="entry" placeholder="你的 email" required autocomplete="email">
      <button class="btn" type="submit" id="mailSubmit">訂閱</button>
    </form>
    <p class="mail__ok" id="mailOk"></p>
  </section>
  <a class="btn" id="mailBtn" href="#" target="_blank" rel="noopener" hidden></a>
  <iframe name="mailSink" style="display:none" title="submit sink"></iframe>

  <section class="video" id="video" hidden>
    <p class="video__t" id="videoTitle"></p>
    <div class="video__frame" id="videoFrame"></div>
  </section>

  <section class="blk">
    <p class="label" id="itemsLabel" hidden></p>
    <div class="items" id="itemsList"></div>
  </section>

  <section class="about blk" id="about" hidden>
    <h2 id="aboutTitle"></h2>
    <div id="aboutBody"></div>
    <p class="about__sig" id="aboutSig"></p>
  </section>

  <a class="btn btn--alt" id="extraBtn" href="#" target="_blank" rel="noopener" hidden></a>

  <p class="foot" id="foot"></p>
  <p style="text-align:center;margin:0"><a class="foot__admin" href="admin.html">系統登入</a></p>
</div>

<script>
const $ = id => document.getElementById(id);
const on = v => v === true || v === 'true';        // content.json 兩種寫法都吃
const txt = (id,v) => { const e=$(id); if(e) e.textContent = v||''; };
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* 按鈕出現的條件:enabled 為真 **而且** 有網址。
   少了後面那半,後台把網址清空就會留一顆點了沒反應的按鈕。 */
function bigBtn(id, cfg){
  const e = $(id);
  const show = cfg && on(cfg.enabled) && cfg.url;
  if (!show){ e.hidden = true; return; }
  e.hidden = false; e.href = cfg.url;
  e.innerHTML = esc(cfg.buttonText || cfg.title || '') +
                (cfg.desc ? `<small>${esc(cfg.desc)}</small>` : '');
}

function renderMarquee(m){
  const el=$('marquee'), track=$('marqueeTrack');
  let items = m && m.items;
  if (typeof items === 'string') items = items.split(/\r?\n/);
  items = (Array.isArray(items)?items:[]).map(s=>String(s||'').trim()).filter(Boolean);
  if (!m || !on(m.enabled) || !items.length){ el.hidden = true; return; }
  const one = items.join('　　◆　　') + '　　◆　　';
  track.textContent = one + one;                   // 接兩份,捲到底不會留一段白
  track.style.setProperty('--marquee-speed',(Number(m.speed)||26)+'s');
  el.hidden = false;
}

/* 電子報:
   ① 有 formAction(Google 表單的 formResponse 網址)→ 頁面內直接送出,不跳走
   ② 只有 url → 退回一般按鈕
   ③ 兩個都沒有 → 不顯示(不留一顆點了沒反應的東西) */
function renderMail(n){
  const box=$('mail'), btn=$('mailBtn');
  box.hidden = true; btn.hidden = true;
  if (!n || !on(n.enabled)) return;

  if (n.formAction && n.formField){
    box.hidden = false;
    txt('mailTitle', n.buttonText || '訂閱電子報');
    txt('mailDesc', n.desc);
    $('mailSubmit').textContent = n.submitText || '訂閱';
    const f = $('mailForm');
    f.action = n.formAction;
    $('mailInput').name = n.formField;
    f.onsubmit = () => {                            // target=iframe,所以送出不會離開頁面
      setTimeout(()=>{ $('mailOk').textContent = n.thanks || '收到了,謝謝你 ✉'; f.reset(); }, 400);
    };
    return;
  }
  bigBtn('mailBtn', n);
}

/* 嵌入的 YouTube。
   ・用 youtube-nocookie 網域:沒按播放前不會種追蹤 cookie
   ・loading=lazy:影片不在第一屏,不要拖慢開頁
   ・網址整條貼進來也吃得下(耗耗貼的就是完整網址,不是 ID) */
function ytId(s){
  s = String(s||'').trim();
  if (!s) return '';
  const m = s.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([A-Za-z0-9_-]{11})/);
  if (m) return m[1];
  return /^[A-Za-z0-9_-]{11}$/.test(s) ? s : '';
}
function renderVideo(v){
  const box = $('video'), id = ytId(v && v.youtubeId);
  if (!v || !on(v.enabled) || !id){ box.hidden = true; return; }
  box.hidden = false;
  txt('videoTitle', v.title);
  $('videoFrame').innerHTML =
    `<iframe src="https://www.youtube-nocookie.com/embed/${id}?rel=0" loading="lazy"
      title="${esc(v.title||'影片')}" allow="accelerometer;clipboard-write;encrypted-media;picture-in-picture"
      allowfullscreen></iframe>`;
}

function render(c){
  const meta = c.meta||{};
  document.title = meta.title || '陳則皞';
  txt('name', meta.title || '陳則皞');
  txt('barL', meta.title || '陳則皞');
  if (meta.barRight) txt('barR', meta.barRight);
  txt('tagline', meta.tagline);
  if (meta.avatar){ $('avatar').src = meta.avatar; $('avatar').hidden = false; }

  renderMarquee(c.marquee);

  $('socials').innerHTML = (c.socials||[]).filter(s=>s&&s.url).map(s=>
    `<a class="social" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a>`).join('');

  bigBtn('podcastBtn', c.podcast);
  renderMail(c.newsletter);
  renderVideo(c.video);
  bigBtn('extraBtn', c.extra);

  const r = c.releases||{};
  const showItems = on(r.enabled) && (r.items||[]).some(i=>i&&i.url);
  $('itemsLabel').hidden = !(showItems && r.title);
  txt('itemsLabel', r.title);
  $('itemsList').innerHTML = !showItems ? '' : (r.items||[]).filter(i=>i&&i.url).map(i=>`
    <a class="item" href="${esc(i.url)}" target="_blank" rel="noopener">
      <span class="item__cover">${i.cover?`<img src="${esc(i.cover)}" alt="">`:'NO IMG'}</span>
      <span><span class="item__t">${esc(i.title)}</span><span class="item__s">${esc(i.sub)}</span></span>
    </a>`).join('');

  const a = c.about||{};
  $('about').hidden = !(on(a.enabled) && a.body);
  txt('aboutTitle', a.title); txt('aboutSig', a.signature);
  $('aboutBody').innerHTML = String(a.body||'').split(/\n{2,}/)
    .map(par=>`<p>${esc(par).replace(/\n/g,'<br>')}</p>`).join('');

  txt('foot', (c.footer&&c.footer.text)||'');
  $('wrap').dataset.ready = '1';
}

fetch('content.json?t='+Date.now()).then(r=>r.json()).then(render).catch(err=>{
  console.error(err);
  $('wrap').dataset.ready='1';                     // 讀不到也別留白畫面
  txt('tagline','內容載入失敗,請重新整理');
});
</script>
</body>
</html>
